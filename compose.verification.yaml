services:
  scheduled-runtime:
    restart: "no"
    environment:
      BOT_MODE: normal
      MYSQL_PERSISTENCE_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_VERIFICATION_DATABASE:?MYSQL_VERIFICATION_DATABASE is required}
      MYSQL_USER: ${MYSQL_VERIFICATION_USER:?MYSQL_VERIFICATION_USER is required}
      MYSQL_PASSWORD: ${MYSQL_VERIFICATION_PASSWORD:?MYSQL_VERIFICATION_PASSWORD is required}

  runtime:
    restart: "no"
    environment:
      BOT_MODE: normal
      MYSQL_PERSISTENCE_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_VERIFICATION_DATABASE:?MYSQL_VERIFICATION_DATABASE is required}
      MYSQL_USER: ${MYSQL_VERIFICATION_USER:?MYSQL_VERIFICATION_USER is required}
      MYSQL_PASSWORD: ${MYSQL_VERIFICATION_PASSWORD:?MYSQL_VERIFICATION_PASSWORD is required}
