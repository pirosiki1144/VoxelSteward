# Shared MySQL service definition. Combine this file with one environment
# overlay; the Compose project keeps the data volume isolated.
services:
  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: "no"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  runtime:
    depends_on:
      mysql:
        condition: service_healthy

  scheduled-runtime:
    depends_on:
      mysql:
        condition: service_healthy

  operator-task:
    depends_on:
      mysql:
        condition: service_healthy

  operator-log:
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  # Do not set a global name: Compose project names isolate environments.
  mysql-data: {}
