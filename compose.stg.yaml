# Staging environment overlay. Use with -p voxelsteward-stg and
# --env-file .env.staging; never point this overlay at development or
# production values.
x-staging-env-file: &staging-env-file
  - path: ${VOXEL_ENV_FILE:-.env.staging}
    required: true

services:
  scheduled-runtime:
    env_file: *staging-env-file
    restart: "no"
    environment:
      VOXEL_ENV: staging
      BOT_MODE: normal
      MYSQL_PERSISTENCE_ENABLED: "true"

  runtime:
    env_file: *staging-env-file
    restart: "no"
    environment:
      VOXEL_ENV: staging
      BOT_MODE: normal
      MYSQL_PERSISTENCE_ENABLED: "true"

  smoke:
    env_file: *staging-env-file
    restart: "no"
    environment:
      VOXEL_ENV: staging

  operator-task:
    env_file: *staging-env-file
    environment:
      VOXEL_ENV: staging

  operator-log:
    env_file: *staging-env-file
    environment:
      VOXEL_ENV: staging
