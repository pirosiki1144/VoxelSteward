# Development environment overlay. Use with -p voxelsteward-dev and
# --env-file .env.development; never point this overlay at production values.
x-development-env-file: &development-env-file
  - path: ${VOXEL_ENV_FILE:-.env.development}
    required: true

services:
  mysql:
    environment:
      VOXEL_ENV: development
  scheduled-runtime:
    env_file: *development-env-file
    environment:
      VOXEL_ENV: development
      MYSQL_PERSISTENCE_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
  runtime:
    env_file: *development-env-file
    environment:
      VOXEL_ENV: development
      MYSQL_PERSISTENCE_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
  smoke:
    env_file: *development-env-file
    environment:
      VOXEL_ENV: development
  operator-task:
    env_file: *development-env-file
    environment:
      VOXEL_ENV: development
      MYSQL_PERSISTENCE_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
  operator-log:
    env_file: *development-env-file
    environment:
      VOXEL_ENV: development
      MYSQL_PERSISTENCE_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"

volumes:
  auth-profiles:
    name: voxel-steward-dev-auth-${BOT_ACCOUNT_ID:?BOT_ACCOUNT_ID is required}
