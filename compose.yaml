services:
  smoke:
    build:
      context: .
      dockerfile: Dockerfile
    image: voxel-steward-smoke:local
    init: true
    restart: "no"
    read_only: true
    user: "node"
    env_file:
      - path: .env
        required: false
    environment:
      MINECRAFT_HOST: ${MINECRAFT_HOST:-}
      MINECRAFT_PORT: ${MINECRAFT_PORT:-19132}
      MINECRAFT_VERSION: ${MINECRAFT_VERSION:-}
      BOT_ACCOUNT_ID: ${BOT_ACCOUNT_ID:-}
      BOT_MODE: ${BOT_MODE:-normal}
      SMOKE_TIMEOUT_SECONDS: ${SMOKE_TIMEOUT_SECONDS:-60}
      AUTH_PROFILES_FOLDER: /auth/profiles
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - auth-profiles:/auth/profiles
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 20s

volumes:
  auth-profiles:
    name: voxel-steward-auth-${BOT_ACCOUNT_ID:-default}
