services:
  runtime:
    build:
      context: .
      dockerfile: Dockerfile
    image: voxel-steward:local
    init: true
    restart: "no"
    read_only: true
    user: "node"
    env_file:
      - path: .env
        required: false
    environment:
      MINECRAFT_HOST: ${MINECRAFT_HOST:-}
      MINECRAFT_PORT: ${MINECRAFT_PORT:-19132}
      MINECRAFT_VERSION: ${MINECRAFT_VERSION:-}
      BOT_ACCOUNT_ID: ${BOT_ACCOUNT_ID:-}
      BOT_MODE: normal
      AUTH_PROFILES_FOLDER: /auth/profiles
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUNTIME_MAX_RETRIES: ${RUNTIME_MAX_RETRIES:-3}
      RUNTIME_RECONNECT_INITIAL_DELAY_MS: ${RUNTIME_RECONNECT_INITIAL_DELAY_MS:-1000}
      RUNTIME_RECONNECT_MAX_DELAY_MS: ${RUNTIME_RECONNECT_MAX_DELAY_MS:-30000}
      RUNTIME_CONNECTION_TIMEOUT_MS: ${RUNTIME_CONNECTION_TIMEOUT_MS:-15000}
      DISCORD_NOTIFICATIONS_ENABLED: ${DISCORD_NOTIFICATIONS_ENABLED:-false}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      MYSQL_PERSISTENCE_ENABLED: ${MYSQL_PERSISTENCE_ENABLED:-false}
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_CONNECTION_TIMEOUT_MS: ${MYSQL_CONNECTION_TIMEOUT_MS:-5000}
    volumes:
      - auth-profiles:/auth/profiles
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 20s

  smoke:
    build:
      context: .
      dockerfile: Dockerfile
    image: voxel-steward-smoke:local
    command: ["node", "dist/src/smoke.js"]
    init: true
    restart: "no"
    read_only: true
    user: "node"
    env_file:
      - path: .env
        required: false
    environment:
      MINECRAFT_HOST: ${MINECRAFT_HOST:-}
      MINECRAFT_PORT: ${MINECRAFT_PORT:-19132}
      MINECRAFT_VERSION: ${MINECRAFT_VERSION:-}
      BOT_ACCOUNT_ID: ${BOT_ACCOUNT_ID:-}
      BOT_MODE: ${BOT_MODE:-normal}
      SMOKE_TIMEOUT_SECONDS: ${SMOKE_TIMEOUT_SECONDS:-60}
      AUTH_PROFILES_FOLDER: /auth/profiles
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - auth-profiles:/auth/profiles
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 20s

  operator-task:
    profiles: ["operator"]
    build:
      context: .
      dockerfile: Dockerfile
    image: voxel-steward:local
    entrypoint: ["node", "dist/src/operator-task.js"]
    command: []
    init: true
    restart: "no"
    read_only: true
    user: "node"
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_PERSISTENCE_ENABLED: ${MYSQL_PERSISTENCE_ENABLED:-false}
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_CONNECTION_TIMEOUT_MS: ${MYSQL_CONNECTION_TIMEOUT_MS:-5000}
    tmpfs:
      - /tmp:size=16m,mode=1777

  block-placement-acceptance:
    profiles: ["acceptance"]
    build:
      context: .
      dockerfile: Dockerfile
    image: voxel-steward-block-placement-acceptance:local
    command: ["node", "dist/src/block-placement-acceptance.js"]
    init: true
    restart: "no"
    read_only: true
    user: "node"
    environment:
      BOT_MODE: normal
      MINECRAFT_VERSION: ${MINECRAFT_VERSION:-}
      BLOCK_PLACEMENT_ACCEPTANCE_ENABLED: ${BLOCK_PLACEMENT_ACCEPTANCE_ENABLED:-false}
      BLOCK_PLACEMENT_OPERATOR_CONFIRMED: ${BLOCK_PLACEMENT_OPERATOR_CONFIRMED:-false}
      BLOCK_PLACEMENT_MAX_ATTEMPTS: "1"
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 20s

  mysql-test:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    profiles: ["test"]
    restart: "no"
    environment:
      MYSQL_DATABASE: voxel_steward_test
      MYSQL_USER: voxel_test
      MYSQL_PASSWORD: voxel_test_password
      MYSQL_ROOT_PASSWORD: voxel_root_test_password
    tmpfs:
      - /var/lib/mysql:size=256m
    ports:
      - "127.0.0.1:33060:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

volumes:
  auth-profiles:
    name: voxel-steward-auth-${BOT_ACCOUNT_ID:-default}
