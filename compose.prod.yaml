# Production environment overlay. Use with -p voxelsteward-prod and
# --env-file .env.prod; never point this overlay at development or staging values.
x-production-env-file: &production-env-file
  - path: ${VOXEL_ENV_FILE:-.env.prod}
    required: true

services:
  mysql:
    environment:
      VOXEL_ENV: production
  scheduled-runtime:
    env_file: *production-env-file
    environment:
      VOXEL_ENV: production
      MYSQL_PERSISTENCE_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
  runtime:
    env_file: *production-env-file
    environment:
      VOXEL_ENV: production
      MYSQL_PERSISTENCE_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
  smoke:
    env_file: *production-env-file
    environment:
      VOXEL_ENV: production
  operator-task:
    env_file: *production-env-file
    environment:
      VOXEL_ENV: production
      MYSQL_PERSISTENCE_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
  operator-log:
    env_file: *production-env-file
    environment:
      VOXEL_ENV: production
      MYSQL_PERSISTENCE_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"

volumes:
  auth-profiles:
    name: voxel-steward-prod-auth-${BOT_ACCOUNT_ID:?BOT_ACCOUNT_ID is required}
  mysql-data:
    name: voxelsteward-prod-mysql-data
